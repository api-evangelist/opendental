description: >-
  FinOps view of Open Dental API spend. Open Dental's REST API is billed per
  location: a Developer Key plus a per-customer Customer Key must be enabled
  before charges apply, and billing stops when a key is disabled. The dominant
  cost driver is therefore the number of active locations / enabled customer
  keys rather than per-request metering. Open Dental does not publish public
  per-location dollar amounts and negotiates pricing with high-volume
  developers. A free test database exists for pre-production development. The
  Local API / API Service option runs at the practice workstation and is not
  metered or throttled through Open Dental's cloud, shifting cost to on-premises
  infrastructure rather than a per-call cloud charge.
notes: >-
  Per-location rates are not reconciled here; verify with Open Dental. Cost
  optimization centers on enabling keys only for active locations and disabling
  unused keys promptly (billing halts on disable), plus choosing the Local API
  where volume would otherwise strain cloud throttling limits.
