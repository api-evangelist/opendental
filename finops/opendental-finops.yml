meters:
- name: active_locations
  description: Number of locations with an enabled API Customer Key; the primary per-location billing driver.
  unit: locations
  aggregation: sum
  dimensions:
  - customer
  - developer_key
- name: enabled_customer_keys
  description: Count of enabled per-customer Customer Keys; billing starts on enable and stops on disable.
  unit: keys
  aggregation: sum
  dimensions:
  - customer
- name: api_requests
  description: Volume of cloud REST API requests; not directly billed but bounded by permission-tier throttling.
  unit: requests
  aggregation: sum
  dimensions:
  - developer_key
  - customer
- name: local_api_usage
  description: Requests handled by the un-throttled Local API / API Service at the practice workstation (on-premises cost, no cloud charge).
  unit: requests
  aggregation: sum
  dimensions:
  - location
principles:
- name: Visibility
  description: Track which locations have enabled Customer Keys and which Developer Keys they map to; that count is what you are billed on.
- name: Allocation
  description: Map enabled keys to specific customers/locations so per-location API cost is attributed to the right practice or client.
- name: Optimization
  description: Disable unused Customer Keys promptly (billing halts on disable), request only the permission tier you need, and use the un-throttled Local API for high-volume single-location workloads.
- name: Accountability
  description: Review active-location and enabled-key counts monthly against contracted per-location pricing; negotiate volume pricing with Open Dental when scaling across many practices.
