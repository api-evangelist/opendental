aid: opendental
url: https://raw.githubusercontent.com/api-evangelist/opendental/refs/heads/main/apis.yml
name: Open Dental
kind: company
description: >-
  Open Dental is dental practice management software with an openly documented
  public REST API. The API is hosted at Open Dental headquarters (base
  https://api.opendental.com/api/v1) and lets approved third-party developers
  read and write practice data - patients, appointments, providers, procedures,
  insurance claims, payments, ledger adjustments, fee schedules, recalls,
  documents, medications and prescriptions, referrals, and clinical sheets - on
  behalf of Open Dental customers. Requests authenticate with a per-application
  Developer Key and a per-customer Customer Key sent together in an
  Authorization ODFHIR {DeveloperKey}/{CustomerKey} header. The public spec
  documents 130+ resource groups with GET/POST/PUT/DELETE operations. Open
  Dental also runs a local API Service option that talks to the on-premises Open
  Dental program without routing through Open Dental's servers, and a separate
  FHIR interface.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Dental
- Practice Management
- Healthcare
- EHR
- Patient Records
- REST
