components:
  securitySchemes:
    odfhirAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        Send "ODFHIR {DeveloperKey}/{CustomerKey}" - the per-application
        Developer Key issued by Open Dental Vendor Relations combined with the
        per-customer Customer Key. Some endpoints also accept HTTP Basic auth
        with the Developer Key as username and the Customer Key as password.
  parameters:
    PatNum:
      name: PatNum
      in: path
      required: true
      description: Primary key of the patient.
      schema: { type: integer }
    AptNum:
      name: AptNum
      in: path
      required: true
      description: Primary key of the appointment.
      schema: { type: integer }
    ProvNum:
      name: ProvNum
      in: path
      required: true
      description: Primary key of the provider.
      schema: { type: integer }
    ProcNum:
      name: ProcNum
      in: path
      required: true
      description: Primary key of the procedure log.
      schema: { type: integer }
    ClaimNum:
      name: ClaimNum
      in: path
      required: true
      description: Primary key of the claim.
      schema: { type: integer }
    PayNum:
      name: PayNum
      in: path
      required: true
      description: Primary key of the payment.
      schema: { type: integer }
    Offset:
      name: Offset
      in: query
      required: false
      description: Number of records to skip for pagination.
      schema: { type: integer, default: 0 }
  requestBodies:
    Generic:
      description: >-
        Resource fields as a JSON object. See the per-resource reference page
        on opendental.com/site/apispecification.html for exact field names.
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    Ok:
      description: Success. Returns one item or an array of items.
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                additionalProperties: true
              - type: array
                items:
                  type: object
                  additionalProperties: true
    Created:
      description: >-
        Created. Typically returns a Location header and the created object.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    BadRequest:
      description: Bad request - invalid or missing fields.
    NotFound:
      description: The requested resource was not found.
