openapi: 3.0.3
info:
  title: Open Dental API
  description: >-
    REST API for Open Dental dental practice management software. The web
    service is hosted at Open Dental headquarters and lets approved third-party
    applications read and write practice data on behalf of Open Dental
    customers. Requests authenticate with a per-application Developer Key and a
    per-customer Customer Key, sent together in a single header as
    "Authorization: ODFHIR {DeveloperKey}/{CustomerKey}". The full published
    specification documents 130+ resource groups; this document models a
    representative, load-bearing subset. The paths under Patients,
    Appointments, Providers, ProcedureLogs (Procedures), Claims, and Payments
    are grounded in the published per-resource reference pages and are marked
    CONFIRMED below. The remaining resource groups (Accounts/Ledger, Fees & Fee
    Schedules, Recalls, Documents, Medications & Prescriptions, Referrals,
    Sheets) follow Open Dental's standard REST CRUD convention and are marked
    MODELED - verify exact paths and fields against the live spec before use.
    A separate local API Service (talks to the on-premises Open Dental program
    without routing through Open Dental servers) and a FHIR interface also
    exist and are out of scope for this document.
  version: v1
  contact:
    name: Open Dental Software Vendor Relations
    url: https://www.opendental.com/site/apispecification.html
    email: vendor.relations@opendental.com
  license:
    name: Open Dental (proprietary; source viewable under Open Dental license)
    url: https://www.opendental.com/site/sourcecode.html
servers:
  - url: https://api.opendental.com/api/v1
    description: Open Dental cloud-hosted API service (headquarters)
security:
  - odfhirAuth: []
tags:
  - name: Patients
    description: CONFIRMED. Patient demographic records.
  - name: Appointments
    description: CONFIRMED. Scheduling, slots, and WebSched.
  - name: Providers
    description: CONFIRMED. Dentists, hygienists, and billing entities.
  - name: Procedures
    description: CONFIRMED. ProcedureLogs, insurance history, and group notes.
  - name: Claims
    description: CONFIRMED. Insurance claims and claim workflow.
  - name: Payments
    description: CONFIRMED. Patient payments, refunds, and split reallocation.
  - name: Accounts & Ledger
    description: MODELED. Adjustments and payment splits on the patient ledger.
  - name: Fees & Fee Schedules
    description: MODELED. Procedure fees and fee schedules.
  - name: Recalls
    description: MODELED. Hygiene / continuing-care recalls.
  - name: Documents
    description: MODELED. Files and images attached to a patient.
  - name: Medications & Prescriptions
    description: MODELED. Medication catalog, patient meds, and prescriptions.
  - name: Referrals
    description: MODELED. Referral sources and attachments.
  - name: Sheets
    description: MODELED. Configurable clinical and administrative forms.
paths:
  # ---------------- Patients (CONFIRMED) ----------------
  /patients/{PatNum}:
    get:
      tags: [Patients]
      summary: Get a single patient
      description: CONFIRMED. Retrieves one patient by PatNum.
      parameters:
        - $ref: '#/components/parameters/PatNum'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Patients]
      summary: Update a patient
      description: CONFIRMED. Updates an existing patient. Patients cannot be deleted via the API.
      parameters:
        - $ref: '#/components/parameters/PatNum'
      requestBody: { $ref: '#/components/requestBodies/Generic' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /patients/Simple:
    get:
      tags: [Patients]
      summary: List patients (Simple)
      description: >-
        CONFIRMED. Fast listing of patients with optional filters. Faster than
        the full patient search.
      parameters:
        - { name: LName, in: query, schema: { type: string } }
        - { name: FName, in: query, schema: { type: string } }
        - { name: PatStatus, in: query, schema: { type: string } }
        - { name: Birthdate, in: query, schema: { type: string, format: date } }
        - { name: ClinicNum, in: query, schema: { type: integer } }
        - { name: DateTStamp, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /patients:
    get:
      tags: [Patients]
      summary: Search patients
      description: >-
        CONFIRMED. Searches patients using Patient Select-style logic with many
        optional criteria.
      parameters:
        - { name: LName, in: query, schema: { type: string } }
        - { name: FName, in: query, schema: { type: string } }
        - { name: Phone, in: query, schema: { type: string } }
        - { name: Address, in: query, schema: { type: string } }
        - { name: hideInactive, in: query, schema: { type: boolean } }
        - { name: SSN, in: query, schema: { type: string } }
        - { name: ChartNumber, in: query, schema: { type: string } }
        - { name: Birthdate, in: query, schema: { type: string, format: date } }
        - { name: Email, in: query, schema: { type: string } }
        - { name: clinicNums, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Offset'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [Patients]
      summary: Create a patient
      description: CONFIRMED. Creates a new patient.
      requestBody: { $ref: '#/components/requestBodies/Generic' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------- Appointments (CONFIRMED) ----------------
  /appointments/{AptNum}:
