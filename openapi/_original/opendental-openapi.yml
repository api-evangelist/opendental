        - { name: PatNum, in: query, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ---------------- Sheets (MODELED) ----------------
  /sheets:
    get:
      tags: [Sheets]
      summary: List sheets
      description: MODELED. Clinical and administrative forms per patient.
      parameters:
        - { name: PatNum, in: query, schema: { type: integer } }
