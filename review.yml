aid: opendental
name: Open Dental
review:
  question: Does Open Dental expose a documented public WebSocket API?
  answer: false
  date: '2026-07-03'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Open Dental's public developer surface is
    a request/response REST API hosted at Open Dental headquarters
    (https://api.opendental.com/api/v1), plus an on-premises Local API / API
    Service and a separate FHIR interface - all request/response. There is no
    server-push transport (WebSocket or SSE) documented on Open Dental's public
    API to model. Applications that need change awareness poll REST resources
    (for example, filtering by DateTStamp / SecDateTEdit).
findings:
  summary: |
    Open Dental does not publish a documented public WebSocket API. Open Dental
    is dental practice management software whose public API is a REST API hosted
    at Open Dental headquarters, base https://api.opendental.com/api/v1.
    Requests authenticate with an "Authorization: ODFHIR
    {DeveloperKey}/{CustomerKey}" header (Developer Key issued by Open Dental
    Vendor Relations; Customer Key per customer); some endpoints also accept
    HTTP Basic with the Developer Key as username and Customer Key as password.
    The published specification documents 130+ resource groups using standard
    GET/POST/PUT/DELETE semantics. Open Dental also offers an on-premises Local
    API / API Service (runs at the practice workstation against the running
    program, not routed through Open Dental servers and not throttled) and a
    distinct FHIR interface. No realtime, bidirectional, or streaming WebSocket
    (ws:// or wss://) endpoint is documented anywhere on Open Dental's public
    API as of the review date.
  openSource: |
    Open Dental's application source code is viewable on GitHub
    (github.com/OpenDental) under Open Dental's own license and is often
    described as "open source," but Open Dental does not accept outside code
    contributions and only posts stable per-version branches. The commercial
    practice-management product and its hosted API are proprietary services.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.opendental.com/api/v1
      documented: true
      note: Cloud REST API hosted at Open Dental HQ. ODFHIR header auth (or HTTP Basic). 130+ resource groups.
    - protocol: REST (Local API / API Service)
      scheme: http
      documented: true
      note: Requests run at the practice workstation against the on-premises Open Dental program; not routed through Open Dental servers and not throttled.
    - protocol: FHIR (REST)
      scheme: https
      documented: true
      note: Separate HL7 FHIR interface documented in the Open Dental FHIR spec; still request/response REST, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in Open Dental's public API as of the review date.
