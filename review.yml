actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Open Dental's public API is
    request/response REST (cloud API, Local API / API Service, and a FHIR
    interface). No AsyncAPI document was created because there is no server-push
    transport on Open Dental's own API to model; change awareness is handled by
    polling REST resources with timestamp filters.
